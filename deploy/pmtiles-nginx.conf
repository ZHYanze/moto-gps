# 把 NAS 上的 PMTiles 文件暴露给 moto-gps 后端
# 挂载卷:/volume1/docker/moto-gps/pmtiles -> /usr/share/nginx/html
# 所以浏览器/后端请求 http://pmtiles/china.pmtiles 就能取到 /volume1/.../china.pmtiles

server {
    listen 80;
    server_name _;

    # 健康检查
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # PMTiles 静态文件
    # ⚠️ Range 是关键:PMTiles 客户端用 HTTP Range 字节级请求,
    # nginx 的 try_files 在静态文件场景下默认就支持 Range,不用开。
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        # 防意外列出目录
        autoindex off;
    }
}
