# MOTO GPS 后端：飞牛 NAS + Docker 直跑模式（无前置反代）
#
# 架构：飞牛 NAS 上的 Docker 容器监听 0.0.0.0:8787 → 宿主机回环 127.0.0.1:8787
#       → 内网穿透客户端（cloudflared / frpc / npc / tailscaled 等）走公网绑定域名和证书。
#
# PMTiles 自托管走 Cloudflare Tunnel:
#   pmtiles nginx 容器 listen 127.0.0.1:8081
#   → cloudflared 把 map.nav.imzyz.com 反代到 http://localhost:8081
#   → backend 用 https://map.nav.imzyz.com/china.pmtiles 取文件
#
# 第一次构建：docker compose up -d --build
# 重启服务：  docker compose restart
# 改 .env 后： docker compose up -d --force-recreate
# 看日志：    docker compose logs -f --tail=100
# 进入容器：  docker compose exec backend sh

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: moto-gps-backend:local
    container_name: moto-gps-backend
    restart: unless-stopped
    env_file:
      - .env
    # 只绑定到宿主机回环，不暴露给局域网。
    # 内网穿透客户端从宿主机 127.0.0.1:8787 拉流量即可。
    # ⚠️ 若删掉 `127.0.0.1:` 让 LAN 直接访问，NAS 会裸奔在公网，**不要这么做**。
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # 瓦片缓存目录，重建容器不丢数据。
      - moto-tiles:/app/.cache
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      # ==== PMTiles 自托管(走 Cloudflare Tunnel)====
      # 用公网 HTTPS URL,后端代码不需要改任何东西(https 是默认允许的)。
      # map.nav.imzyz.com 由 cloudflared 反代到下面 pmtiles 容器的 127.0.0.1:8081。
      - MOTO_MAP_PMTILES_URL=https://map.nav.imzyz.com/china.pmtiles
      # 瓦片 JSON 缓存到 SSD(不是 RAM),重启容器不丢
      - MOTO_MAP_CACHE_DIR=/app/.cache/map-tiles
    # 注意:backend 和 pmtiles 不在同一个 docker network,因为 backend
    # 通过公网访问 pmtiles,不通过 docker 内部 DNS。

  # ==== PMTiles 自托管 nginx sidecar(新增) ====
  # 用途:serve NAS 本地的 china.pmtiles 文件,通过 HTTP Range 给 backend 取 tile。
  # 暴露方式:listen 127.0.0.1:8081(只给宿主机/Cloudflare Tunnel 反代访问)
  #          **不映射 LAN 端口**,安全性等同于 backend。
  pmtiles:
    image: nginx:1.27-alpine
    container_name: moto-gps-pmtiles
    restart: unless-stopped
    volumes:
      # /vol1/1000/docker/moto-gps/map 是你 NAS 上已有的 PMTiles 目录(只读)
      - /vol1/1000/docker/moto-gps/map:/usr/share/nginx/html:ro
      # nginx 配置(同目录 deploy/pmtiles-nginx.conf)
      - ./pmtiles-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 只 bind 到宿主机回环,LAN 不可达,跟 backend 同样的安全策略
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      # 强制 IPv4:busybox wget 默认 IPv6 优先,可能解析到 ::1 → nginx 只 listen v4 → 连不上
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 给 nginx 足够启动时间,alpine 默认 1-2 秒,保险多给点
      start_period: 15s

volumes:
  moto-tiles: