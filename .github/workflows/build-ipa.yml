name: Build IPA (user)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec platforms/ios/project.yml

      - name: Build unsigned IPA
        run: scripts/ios/build_sideload_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-GPS-unsigned-IPA
          path: |
            build/sideload/*.ipa
            build/sideload/SHA256SUMS.txt
          if-no-files-found: error
